[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-platform"
version = "0.1.0"
description = "A generic hierarchical multi-agent AI platform for software development lifecycle management"
requires-python = ">=3.11"
dependencies = [
    "autogen-agentchat>=0.4.0",
    "qdrant-client>=1.7.0",
    "redis>=5.0.0",
    "fastembed>=0.2.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
